<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats - FlyEasy</title>
    <link rel="stylesheet" href="style.css">
    <script src="components.js"></script>
    <style>
        .seats-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .plane-wrapper {
            flex: 1;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            text-align: center;
            overflow-x: auto;
        }

        .plane-nose {
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, #eee, transparent);
            border-radius: 50% 50% 0 0;
            margin-bottom: 20px;
            position: relative;
        }

        .plane {
            display: inline-grid;
            grid-template-columns: repeat(7, 40px);
            gap: 15px 10px;
            justify-content: center;
            margin: 0 auto;
        }

        .seat {
            width: 40px;
            height: 45px;
            background: #e0e0e0;
            border-radius: 8px 8px 4px 4px;
            cursor: pointer;
            text-align: center;
            line-height: 45px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            transition: transform 0.2s, background 0.2s;
            user-select: none;
        }

        .seat:not(.aisle):not(.occupied):hover {
            transform: scale(1.1);
            background: #ccc;
        }

        .seat.aisle {
            background: transparent;
            cursor: default;
            color: transparent;
        }

        .seat.occupied {
            background: #ff4d4d;
            color: white;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .seat.premium {
            background: #ffc107;
            color: #333;
        }

        .seat.selected {
            background: #001B94;
            color: white;
            transform: scale(1.1);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 20px; height: 20px;
            border-radius: 4px;
        }

        .summary-sidebar {
            width: 350px;
            position: sticky;
            top: 20px;
        }
        
        .seats-required-msg {
            color: #d32f2f;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
        }
        
        .seats-required-msg.success {
            color: #388e3c;
        }

        body.dark-mode .plane-wrapper, body.dark-mode .summary-sidebar .order-summary {
            background: #1e1e1e;
        }
        body.dark-mode .plane-nose {
            background: linear-gradient(to top, #333, transparent);
        }
        body.dark-mode .seat {
            background: #444; color: #ccc;
        }
        body.dark-mode .seat.occupied {
            background: #8b0000;
        }
        body.dark-mode .seat.premium {
            background: #b8860b; color: #fff;
        }
        body.dark-mode .seat.selected {
            background: #4da6ff; color: #fff;
        }
    </style>
</head>

<body>
    <app-header></app-header>

    <div class="seats-container">
        
        <div class="plane-wrapper">
            <h2>Select your seats</h2>
            <p style="color:#666; margin-bottom: 30px;">Premium front-row seats carry an additional charge.</p>
            
            <div class="plane-nose"></div>
            
            <div class="plane" id="seatMap">
                <!-- Seats generated by JS -->
            </div>

            <div class="legend">
                <div class="legend-item"><div class="legend-box" style="background:#e0e0e0;"></div> Available</div>
                <div class="legend-item"><div class="legend-box" style="background:#ffc107;"></div> Premium (₹500)</div>
                <div class="legend-item"><div class="legend-box" style="background:#ff4d4d;"></div> Occupied</div>
                <div class="legend-item"><div class="legend-box" style="background:#001B94;"></div> Selected</div>
            </div>
        </div>

        <aside class="summary-sidebar">
            <h3 class="checkout-section-title">Your Flight</h3>
            <div class="order-summary" style="margin-bottom: 20px;">
                <div class="summary-row">
                    <span class="summary-label">Route</span>
                    <span class="summary-value" id="sRoute"></span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Flight</span>
                    <span class="summary-value" id="sFlight"></span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Passengers</span>
                    <span class="summary-value" id="sPass"></span>
                </div>
                
                <hr style="border:0; border-top:1px dashed #ccc; margin:15px 0;">

                <div class="summary-row">
                    <span class="summary-label">Base Fare</span>
                    <span class="summary-value" id="sBasePrice"></span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Seat Add-ons</span>
                    <span class="summary-value" id="sAddon"></span>
                </div>
                
                <div class="summary-total">
                    <span class="summary-label">Total Price</span>
                    <span class="summary-value" id="sTotal"></span>
                </div>
            </div>
            
            <span class="seats-required-msg" id="reqMsg">Please select 0 seats</span>
            <button class="pay-btn" id="proceedBtn" onclick="submitSeats()" disabled style="opacity:0.5; cursor:not-allowed;">Proceed to Payment</button>
        </aside>

    </div>

    <app-footer></app-footer>
    <script>
        let booking = JSON.parse(localStorage.getItem("bookingData"));
        
        if(!booking) {
            window.location = "index.html";
        }

        let requiredSeats = parseInt(booking.passengers) || 1;
        let selectedSeatsArr = [];
        let baseTotal = parseInt(booking.price);
        let currentAddon = 0;

        document.getElementById("sRoute").innerText = booking.route;
        document.getElementById("sFlight").innerText = booking.flight;
        document.getElementById("sPass").innerText = requiredSeats;
        document.getElementById("sBasePrice").innerText = formatPrice(baseTotal);
        document.getElementById("sAddon").innerText = formatPrice(currentAddon);
        document.getElementById("sTotal").innerText = formatPrice(baseTotal);
        
        updateRequirementMsg();

        // Generate Seat Map (10 Rows)
        const seatMap = document.getElementById("seatMap");
        const cols = ['A', 'B', 'C', '', 'D', 'E', 'F'];
        
        for (let row = 1; row <= 15; row++) {
            cols.forEach(col => {
                let div = document.createElement("div");
                
                if (col === '') {
                    div.className = "seat aisle";
                    div.innerText = row; // row number in aisle visually
                } else {
                    div.className = "seat";
                    div.innerText = row + col;
                    
                    // Front 3 rows are premium
                    let isPremium = row <= 3;
                    if(isPremium) div.classList.add("premium");
                    
                    // Random occupancy (~30%)
                    let isOccupied = Math.random() < 0.3;
                    if(isOccupied) {
                        div.classList.add("occupied");
                    } else {
                        // Click handler
                        div.onclick = function() {
                            toggleSeat(div, row + col, isPremium);
                        };
                    }
                }
                seatMap.appendChild(div);
            });
        }

        function toggleSeat(elem, seatId, isPremium) {
            let isSel = elem.classList.contains("selected");
            
            if (isSel) {
                elem.classList.remove("selected");
                selectedSeatsArr = selectedSeatsArr.filter(s => s.id !== seatId);
                if(isPremium) currentAddon -= 500;
            } else {
                if (selectedSeatsArr.length >= requiredSeats) {
                    showToast("You have already selected all required seats.", "error");
                    return;
                }
                elem.classList.add("selected");
                selectedSeatsArr.push({ id: seatId, premium: isPremium });
                if(isPremium) currentAddon += 500;
            }
            
            updateRequirementMsg();
            document.getElementById("sAddon").innerText = formatPrice(currentAddon);
            document.getElementById("sTotal").innerText = formatPrice(baseTotal + currentAddon);
        }

        function updateRequirementMsg() {
            let msgBox = document.getElementById("reqMsg");
            let btn = document.getElementById("proceedBtn");
            let dist = requiredSeats - selectedSeatsArr.length;
            
            if (dist > 0) {
                msgBox.innerText = `Please select ${dist} more seat${dist>1?'s':''}`;
                msgBox.className = "seats-required-msg";
                btn.disabled = true;
                btn.style.opacity = "0.5";
                btn.style.cursor = "not-allowed";
            } else {
                msgBox.innerText = "All seats selected!";
                msgBox.className = "seats-required-msg success";
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
            }
        }

        function submitSeats() {
            if (selectedSeatsArr.length < requiredSeats) return;
            
            // Save add-on strings and new price
            let seatStr = selectedSeatsArr.map(s => s.id).join(", ");
            booking.seats = seatStr;
            booking.price = baseTotal + currentAddon; // update final price
            
            localStorage.setItem("bookingData", JSON.stringify(booking));
            window.location = "payment.html";
        }

    </script>
</body>
</html>
